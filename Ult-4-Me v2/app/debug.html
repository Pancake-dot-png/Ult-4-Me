<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ULT-4-ME Debug</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;800&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #ff1f8f;
  --accent-2: #00f0ff;
  --bg: #07030d;
  --bg-2: #0d0717;
  --panel: rgba(255, 255, 255, 0.04);
  --line: rgba(255, 31, 143, 0.22);
  --ink: #f4e8ff;
  --dim: rgba(244, 232, 255, 0.55);
  --dim-2: rgba(244, 232, 255, 0.32);
  --green: #1fd97a;
  --yellow: #ffce40;
  --red: #ff3a52;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Rajdhani', sans-serif;
  font-size: 14px;
  color: var(--ink);
  background:
    radial-gradient(circle at 12% 8%, rgba(255, 31, 143, 0.1), transparent 40%),
    radial-gradient(circle at 88% 92%, rgba(0, 240, 255, 0.06), transparent 45%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
}

.container {
  display: flex; flex-direction: column; height: 100%;
}

/* Header */
.header {
  display: flex; align-items: center; gap: 14px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--line);
  background: rgba(7, 3, 13, 0.7);
  backdrop-filter: blur(8px);
  -webkit-app-region: drag;
  flex-shrink: 0;
}
.header-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 11px; letter-spacing: 0.4em;
  text-transform: uppercase; color: var(--dim);
}
.header-stats {
  margin-left: auto; display: flex; align-items: center; gap: 16px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--dim-2);
  -webkit-app-region: no-drag;
}
.header-stats span { color: var(--accent-2); }

/* Controls bar */
.controls {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.controls label {
  font-size: 12px; color: var(--dim); text-transform: uppercase;
  letter-spacing: 0.1em; cursor: pointer; display: flex; align-items: center; gap: 4px;
}
.controls input[type="checkbox"] { accent-color: var(--accent); }
.filter-input {
  background: rgba(255,255,255,0.06); border: 1px solid var(--line);
  color: var(--ink); font-family: 'JetBrains Mono', monospace; font-size: 12px;
  padding: 4px 8px; border-radius: 3px; outline: none; width: 180px;
}
.filter-input::placeholder { color: var(--dim-2); }
.filter-input:focus { border-color: var(--accent); }
.sort-btn {
  background: rgba(255,255,255,0.06); border: 1px solid var(--line);
  color: var(--dim); font-family: 'Orbitron', sans-serif; font-size: 9px;
  letter-spacing: 0.1em; padding: 4px 10px; cursor: pointer; text-transform: uppercase;
}
.sort-btn:hover, .sort-btn.active { color: var(--ink); border-color: var(--accent); }

/* Grid */
.grid-wrapper {
  flex: 1; overflow-y: auto; padding: 12px 16px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,31,143,0.3) transparent;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 8px;
}

/* Card */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 8px 10px;
  display: grid;
  grid-template-columns: 40px 1fr 60px;
  align-items: center;
  gap: 8px;
  transition: border-color 0.2s, background 0.2s;
}
.card.matched {
  border-color: var(--green);
  background: rgba(31, 217, 122, 0.08);
}
.card.near {
  border-color: var(--yellow);
  background: rgba(255, 206, 64, 0.05);
}

/* Template thumbnail */
.card-thumb {
  width: 40px; height: 40px;
  background: rgba(255,255,255,0.06);
  border-radius: 3px;
  display: grid; place-items: center;
  overflow: hidden;
}
.card-thumb img {
  max-width: 100%; max-height: 100%;
  image-rendering: pixelated;
}

/* Card info */
.card-name {
  font-family: 'Orbitron', sans-serif;
  font-size: 10px; letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-meta {
  font-size: 11px; color: var(--dim-2);
  font-family: 'JetBrains Mono', monospace;
}
.card-region { color: var(--dim); font-size: 10px; }

/* Confidence display */
.card-conf {
  text-align: right;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
}
.conf-value {
  font-size: 18px;
  line-height: 1;
}
.conf-threshold {
  font-size: 9px;
  color: var(--dim-2);
}

/* Confidence bar */
.conf-bar {
  grid-column: 1 / -1;
  height: 3px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  position: relative;
}
.conf-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.15s ease-out, background 0.15s;
  width: 0%;
}
.conf-bar-threshold {
  position: absolute;
  top: -3px; bottom: -3px;
  width: 2px;
  background: var(--ink);
  opacity: 0.5;
  pointer-events: none;
}

/* Threshold slider row */
.threshold-row {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 8px;
  padding-top: 2px;
}
.threshold-row label {
  font-size: 9px; color: var(--dim-2);
  font-family: 'Orbitron', sans-serif;
  letter-spacing: 0.1em; text-transform: uppercase;
  white-space: nowrap;
}
.threshold-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
  outline: none;
}
.threshold-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 2px solid var(--bg);
}
.threshold-slider::-webkit-slider-thumb:hover {
  background: var(--accent-hot);
  transform: scale(1.2);
}
.threshold-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--accent-2);
  min-width: 36px;
  text-align: right;
}

/* Color states */
.conf-cold { color: var(--dim-2); }
.conf-warm { color: var(--yellow); }
.conf-hot { color: var(--green); }
.conf-miss { color: var(--red); }

.bar-cold { background: var(--dim-2); }
.bar-warm { background: var(--yellow); }
.bar-hot { background: var(--green); }

/* Region group headers */
.region-header {
  grid-column: 1 / -1;
  font-family: 'Orbitron', sans-serif;
  font-size: 10px; letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
  padding: 10px 0 4px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 4px;
}
.region-header:first-child { padding-top: 0; }

/* History sparkline */
.sparkline {
  grid-column: 1 / -1;
  height: 16px;
  display: flex; align-items: flex-end; gap: 1px;
}
.spark-bar {
  flex: 1;
  min-width: 2px;
  background: var(--accent);
  opacity: 0.5;
  border-radius: 1px 1px 0 0;
  transition: height 0.1s;
}

/* Freeze indicator */
.frozen-badge {
  position: fixed; top: 42px; right: 16px;
  font-family: 'Orbitron', sans-serif;
  font-size: 10px; letter-spacing: 0.2em;
  color: var(--yellow); background: rgba(255, 206, 64, 0.15);
  border: 1px solid var(--yellow);
  padding: 4px 10px; border-radius: 3px;
  display: none; z-index: 10;
}
.frozen-badge.show { display: block; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <span class="header-title">Debug &middot; Template Confidence</span>
    <div class="header-stats">
      <span id="fps-display">-- fps</span>
      <span id="ping-display">-- ms</span>
      <span id="match-count">0 matches</span>
    </div>
  </div>

  <div class="controls">
    <input type="text" class="filter-input" id="filter" placeholder="Filter templates...">
    <button class="sort-btn active" id="sort-name" data-sort="name">A-Z</button>
    <button class="sort-btn" id="sort-conf" data-sort="conf">Conf</button>
    <button class="sort-btn" id="sort-region" data-sort="region">Region</button>
    <div style="flex:1"></div>
    <label><input type="checkbox" id="show-zero" checked> Show 0%</label>
    <label><input type="checkbox" id="show-history"> Sparklines</label>
    <label><input type="checkbox" id="freeze"> Freeze</label>
  </div>

  <div class="grid-wrapper">
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="frozen-badge" id="frozen-badge">FROZEN</div>

<script>
const { ipcRenderer } = require('electron');
const { getThreshold } = require('./src/debug-threshold');

// State
let detectables = {};  // name -> { filename, threshold, region, points, type }
let templatesDir = ''; // set by main process
let details = {};
let templateErrors = {};
let thresholdEdits = {};
function thresholdFor(name) {
  return getThreshold(detectables[name], details[name], thresholdEdits[name]);
}
let confirmedDetections = {};
let confidence = {};   // name -> current value
let history = {};      // name -> last N values
let frozen = false;
let sortMode = 'name';
let filterText = '';
let showZero = true;
let showHistory = false;
let frameCount = 0;
let lastFpsTime = Date.now();
let fps = 0;

const HISTORY_LEN = 40;

// Pull config from main process on startup
async function loadConfig() {
  try {
    const result = await ipcRenderer.invoke('get-debug-config');
    detectables = result.detectables || {};
    templatesDir = result.templatesDir || '';
    for (const name of Object.keys(detectables)) {
      if (!history[name]) history[name] = [];
    }
    rebuildGrid();
    document.getElementById('fps-display').textContent = `${Object.keys(detectables).length} templates`;
  } catch (e) {
    document.getElementById('fps-display').textContent = 'config error';
    console.error('Failed to load debug config:', e);
  }
}
loadConfig();

// Receive frame data
let totalFrames = 0;
let confKeyCount = 0;
ipcRenderer.on('debug-frame', (_, data) => {
  if (frozen) return;
  hasReceivedFrame = true;
  totalFrames++;
  confKeyCount = Object.keys(data.confidence || {}).length;

  // Live diagnostics in header
  document.getElementById('match-count').textContent =
    `${confKeyCount} conf keys | ${totalFrames} frames`;

  frameCount++;
  const now = Date.now();
  if (now - lastFpsTime >= 1000) {
    fps = frameCount;
    frameCount = 0;
    lastFpsTime = now;
    document.getElementById('fps-display').textContent = `${fps} fps`;
  }

  if (data.ping != null) {
    document.getElementById('ping-display').textContent = `${data.ping.toFixed(0)} ms`;
  }

  // Update confidence values
  const newConf = data.confidence || {};
  confirmedDetections = data.detections || {};
  details = data.details || {};
  templateErrors = data.templateErrors || {};
  let matchCount = 0;

  for (const name of Object.keys(detectables)) {
    const val = newConf[name] ?? 0;
    confidence[name] = val;

    // History
    if (!history[name]) history[name] = [];
    history[name].push(val);
    if (history[name].length > HISTORY_LEN) history[name].shift();

    const det = detectables[name];
    const threshold = thresholdFor(name).value;
    if ((confirmedDetections[name] || 0) > 0) matchCount++;
  }

  document.getElementById('match-count').textContent = `${matchCount} matches`;
  updateCards();
});

function rebuildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const entries = getSortedFiltered();

  for (const [name, det] of entries) {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${cssId(name)}`;

    const thumbSrc = getTemplatePath(det.filename);

    const thresholdState = thresholdFor(name);
    const thr = thresholdState.value;
    card.innerHTML = `
      <div class="card-thumb"><img src="${thumbSrc}" onerror="this.parentElement.textContent='?'"></div>
      <div>
        <div class="card-name" title="${name}">${name}</div>
        <div class="card-meta">
          <span class="card-region">${det.region || '?'}</span>
          &middot; ${det.points ?? 0}pts &middot; t${det.type ?? 0}
        </div>
      </div>
      <div class="card-conf">
        <div class="conf-value conf-cold" id="conf-${cssId(name)}">--</div>
      </div>
      <div class="conf-bar">
        <div class="conf-bar-fill" id="bar-${cssId(name)}"></div>
        <div class="conf-bar-threshold" id="thr-mark-${cssId(name)}" style="left:${thr * 100}%"></div>
      </div>
      <div class="threshold-row">
        <label>thr</label>
        <input type="range" class="threshold-slider" id="thr-${cssId(name)}"
          min="0.1" max="1.0" step="0.01" value="${thr}"
          data-det="${name}" ${thresholdState.field ? '' : 'disabled'}>
        <span class="threshold-val" id="thr-val-${cssId(name)}">${thr.toFixed(2)}</span>
      </div>
      ${showHistory ? `<div class="sparkline" id="spark-${cssId(name)}"></div>` : ''}
    `;
    grid.appendChild(card);

    // Wire up threshold slider
    const slider = card.querySelector(`#thr-${cssId(name)}`);
    slider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      const detName = e.target.dataset.det;
      document.getElementById(`thr-val-${cssId(detName)}`).textContent = val.toFixed(2);
      document.getElementById(`thr-mark-${cssId(detName)}`).style.left = `${val * 100}%`;
      // Update local state so color coding updates immediately
      const field = thresholdFor(detName).field;
      if (!field) return;
      thresholdEdits[detName] = { field, value: val };
      updateCards();
    });
    slider.addEventListener('change', async (e) => {
      const val = parseFloat(e.target.value);
      const detName = e.target.dataset.det;
      // Save to config + forward to Python worker
      const field = thresholdEdits[detName]?.field ?? thresholdFor(detName).field;
      if (!field) return;
      try {
        await ipcRenderer.invoke('set-debug-threshold', detName, val, field);
        detectables[detName][field] = val;
        if (details[detName]) details[detName].threshold = val;
      } catch (error) {
        window.alert(`Could not save threshold: ${error.message}`);
      } finally {
        delete thresholdEdits[detName];
        updateCards();
      }
    });
  }
}

function updateCards() {
  const entries = getSortedFiltered();

  for (const [name, det] of entries) {
    const id = cssId(name);
    const val = confidence[name] ?? 0;
    const thresholdState = thresholdFor(name);
    const threshold = thresholdState.value;
    const nearThreshold = threshold * 0.75;

    // Confidence text
    const confEl = document.getElementById(`conf-${id}`);
    if (!confEl) continue;

    confEl.textContent = templateErrors[name] ? 'ERROR' : val > 0 ? (val * 100).toFixed(1) + '%' : '0.0%';
    confEl.title = templateErrors[name] || 'Structural similarity, not a probability';
    const slider = document.getElementById(`thr-${id}`);
    slider.disabled = !thresholdState.field;
    slider.title = thresholdState.field ? `Active ${thresholdState.mode} threshold` : 'Start detection to identify the active matching method';
    if (!thresholdEdits[name]) slider.value = threshold;
    document.getElementById(`thr-val-${id}`).textContent = threshold.toFixed(2);
    document.getElementById(`thr-mark-${id}`).style.left = `${threshold * 100}%`;

    // Color class
    let colorClass, barClass;
    if ((confirmedDetections[name] || 0) > 0) {
      colorClass = 'conf-hot';
      barClass = 'bar-hot';
    } else if (val >= nearThreshold) {
      colorClass = 'conf-warm';
      barClass = 'bar-warm';
    } else if (val > 0) {
      colorClass = 'conf-cold';
      barClass = 'bar-cold';
    } else {
      colorClass = 'conf-cold';
      barClass = 'bar-cold';
    }
    confEl.className = `conf-value ${colorClass}`;

    // Bar
    const barEl = document.getElementById(`bar-${id}`);
    if (barEl) {
      const pct = Math.min(100, val * 100);
      barEl.style.width = `${pct}%`;
      barEl.className = `conf-bar-fill ${barClass}`;
      // Show threshold marker via background
    }

    // Card highlight
    const card = document.getElementById(`card-${id}`);
    if (card) {
      card.classList.toggle('matched', (confirmedDetections[name] || 0) > 0);
      card.classList.toggle('near', val >= nearThreshold && !(confirmedDetections[name] > 0));
    }

    // Sparkline
    if (showHistory) {
      const sparkEl = document.getElementById(`spark-${id}`);
      if (sparkEl) {
        const hist = history[name] || [];
        sparkEl.innerHTML = hist.map(v => {
          const h = Math.max(1, Math.round(v * 16));
          const color = v >= threshold ? 'var(--green)' : v >= nearThreshold ? 'var(--yellow)' : 'var(--accent)';
          return `<div class="spark-bar" style="height:${h}px;background:${color}"></div>`;
        }).join('');
      }
    }
  }
}

function getSortedFiltered() {
  let entries = Object.entries(detectables);

  // Filter
  if (filterText) {
    const f = filterText.toLowerCase();
    entries = entries.filter(([name, det]) =>
      name.toLowerCase().includes(f) ||
      (det.region || '').toLowerCase().includes(f) ||
      (det.filename || '').toLowerCase().includes(f)
    );
  }

  // Filter zero
  if (!showZero) {
    entries = entries.filter(([name]) => (confidence[name] ?? 0) > 0);
  }

  // Sort
  if (sortMode === 'conf') {
    entries.sort((a, b) => (confidence[b[0]] ?? 0) - (confidence[a[0]] ?? 0));
  } else if (sortMode === 'region') {
    entries.sort((a, b) => (a[1].region || '').localeCompare(b[1].region || '') || a[0].localeCompare(b[0]));
  } else {
    entries.sort((a, b) => a[0].localeCompare(b[0]));
  }

  return entries;
}

function getTemplatePath(filename) {
  if (!filename) return '';
  if (templatesDir) {
    return require('path').join(templatesDir, filename);
  }
  return `../../templates/${filename}`;
}

function cssId(name) {
  return name.replace(/[^a-zA-Z0-9]/g, '_');
}

// Controls
document.getElementById('filter').addEventListener('input', (e) => {
  filterText = e.target.value;
  rebuildGrid();
  updateCards();
});

document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    sortMode = btn.dataset.sort;
    rebuildGrid();
    updateCards();
  });
});

document.getElementById('show-zero').addEventListener('change', (e) => {
  showZero = e.target.checked;
  rebuildGrid();
  updateCards();
});

document.getElementById('show-history').addEventListener('change', (e) => {
  showHistory = e.target.checked;
  rebuildGrid();
  updateCards();
});

document.getElementById('freeze').addEventListener('change', (e) => {
  frozen = e.target.checked;
  document.getElementById('frozen-badge').classList.toggle('show', frozen);
});

// Re-sort by confidence periodically when in conf sort mode
setInterval(() => {
  if (sortMode === 'conf' && !frozen) {
    rebuildGrid();
    updateCards();
  }
}, 1000);

// Show "waiting" if no frames arrive after 3 seconds
let hasReceivedFrame = false;
setTimeout(() => {
  if (!hasReceivedFrame) {
    document.getElementById('ping-display').textContent = 'waiting for vision...';
  }
}, 3000);
</script>
</body>
</html>
