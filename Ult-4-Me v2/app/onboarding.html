<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome to ULT-4-ME</title>
<style>
:root{color-scheme:dark;--accent:#5865f2;--surface:#232428;--card:#2b2d31;--text:#f2f3f5;--muted:#b5bac1;--border:#41434a}
*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--text);font:15px 'Segoe UI',sans-serif}button,input,label{-webkit-app-region:no-drag}button{font:inherit;cursor:pointer}button:focus-visible,label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:4px}
.ob-root{height:100vh;padding:36px 48px 28px;display:flex;flex-direction:column;gap:22px}.win-controls{position:absolute;right:12px;top:8px;display:flex;gap:4px}.win-controls button{border:0;background:transparent;color:var(--muted);width:32px;height:28px;border-radius:4px}.win-controls button:hover{background:var(--border)}header{-webkit-app-region:drag}h1{font-size:28px;margin:0 0 8px;font-weight:650}p{margin:0;color:var(--muted);line-height:1.5}fieldset{border:0;padding:0;margin:0}legend{font-weight:600;margin-bottom:12px}.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{position:relative;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;cursor:pointer}.choice:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.choice input{accent-color:var(--accent);margin:0}.choice strong{display:block;font-size:16px;margin-bottom:4px}.choice small{color:var(--muted);font-size:12px}.colors{display:flex;gap:10px;flex-wrap:wrap}.color{padding:10px 14px;gap:8px}.swatch{width:14px;height:14px;border-radius:50%;background:var(--swatch)}#color-hint{font-size:13px}.ack{display:flex;align-items:center;gap:10px;color:var(--muted);cursor:pointer;margin-top:auto}.ack input{accent-color:var(--accent);width:16px;height:16px}footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:18px;gap:16px}#ob-status{font-size:13px;color:var(--muted)}#ob-continue{border:0;border-radius:6px;background:var(--accent);color:white;padding:12px 20px;font-weight:600}#ob-continue:disabled{opacity:.4;cursor:default}
.themes{display:flex;flex-direction:column;gap:12px;width:460px;max-width:100%}.theme-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 18px}.theme-row:has(input:checked){border-color:var(--accent)}.theme-row>.choice{padding:0;border:0;background:none;box-shadow:none}.choice strong{margin:0}.colors{gap:12px}.color{width:38px;height:38px;padding:5px;border:2px solid transparent;border-radius:50%;display:grid;place-items:center}.color:has(input:checked){border-color:var(--accent);box-shadow:none}.color input{position:absolute;opacity:0;width:1px;height:1px}.swatch{width:24px;height:24px;box-shadow:0 0 0 1px var(--border)}

.theme-row[data-theme="cyberpunk"]{background:#11101c;color:#eee7ff;border-color:#50314f;border-radius:4px}.theme-row[data-theme="cyberpunk"] strong{font-family:Consolas,monospace;letter-spacing:1px}.theme-row[data-theme="plush"]{background:linear-gradient(110deg,#fff0f6,#f1eaff);color:#63385b;border-color:#e6bed7;border-radius:18px;box-shadow:0 4px 0 #d7b7d1}.theme-row[data-theme="plush"] strong{font-family:'Segoe UI',sans-serif}.theme-row[data-theme="discord"]{background:#2b2d31;color:#f2f3f5;border-color:#41434a;border-radius:8px}.theme-row .choice:has(input:checked){border-color:var(--choice-accent);box-shadow:none}.theme-row:has(input:checked){border-color:var(--choice-accent)}.theme-row input{accent-color:var(--choice-accent)}

.theme-row[data-theme]{color:var(--preview-ink);border-color:var(--preview-line)}
</style>
</head>
<body>
<main class="ob-root">
<div class="win-controls"><button id="btn-minimize" aria-label="Minimize">−</button><button id="btn-close" aria-label="Close">×</button></div>
<header><h1>Make ULT-4-ME yours</h1><p>Choose a theme and color. You can change both later in Appearance.</p></header>
<fieldset><legend>Theme</legend><div class="themes" id="ob-rows"></div></fieldset>

<label class="ack"><input type="checkbox" id="ob-gooner-check"><span>Yes, I'm a gosh darn gooner. 😔</span></label>
<footer><span id="ob-status" role="status">Choose a theme to get started.</span><button id="ob-continue" disabled>Open ULT-4-ME</button></footer>
</main>
<script>
const {ipcRenderer}=require('electron');
const {THEMES,readThemeColors,styleThemePreview}=require(require('path').join(__dirname,'src','theme-previews.js'));
const FAMILIES=[{key:'cyberpunk',label:'Cyberpunk'},{key:'plush',label:'Plush Pastel'},{key:'discord',label:'Discord'}].map(family=>({...family,colors:Object.entries(THEMES[family.key]).map(([key,theme])=>[key,theme.label,theme.accent])}));
const changedThemeColors={};
let themeColors=readThemeColors();
let selectedFamily=null,selectedTint=null;
const rows=document.getElementById('ob-rows');
for(const family of FAMILIES){
 const row=document.createElement('div');row.className='theme-row';row.dataset.theme=family.key;styleThemePreview(row,family.key,themeColors[family.key]);
 const label=document.createElement('label');label.className='choice';
 const input=document.createElement('input');input.type='radio';input.name='theme';input.value=family.key;
 const title=document.createElement('strong');title.textContent=family.label;label.append(input,title);
 const palette=document.createElement('div');palette.className='colors';palette.setAttribute('role','group');palette.setAttribute('aria-label',family.label+' colors');
 for(const color of family.colors){
  const dot=document.createElement('label');dot.className='choice color';dot.title=color[1];
  const radio=document.createElement('input');radio.type='radio';radio.name='color-'+family.key;radio.checked=color[0]===themeColors[family.key];radio.value=color[0];radio.dataset.family=family.key;radio.setAttribute('aria-label',family.label+' '+color[1]);
  const swatch=document.createElement('span');swatch.className='swatch';swatch.setAttribute('aria-hidden','true');
  swatch.style.background=family.key==='discord'?'linear-gradient(90deg,'+(color[0]==='dark'?'#17181c 50%,#5865f2 50%':'#ffffff 50%,#5865f2 50%')+')':color[2];
  dot.append(radio,swatch);palette.append(dot);radio.addEventListener('change',()=>selectTheme(family.key,color[0]));
 }
 row.append(label,palette);rows.append(row);input.addEventListener('change',()=>selectTheme(family.key,themeColors[family.key]));
}
function selectTheme(familyKey,tintKey){
 const family=FAMILIES.find(item=>item.key===familyKey),tint=family.colors.find(item=>item[0]===tintKey);
 themeColors[familyKey]=tintKey;changedThemeColors[familyKey]=tintKey;
 styleThemePreview(document.querySelector('.theme-row[data-theme="'+familyKey+'"]'),familyKey,tintKey);
 selectedFamily=familyKey;selectedTint=tintKey;document.documentElement.style.setProperty('--accent',tint[2]);
 document.querySelector('input[name="theme"][value="'+familyKey+'"]').checked=true;
 for(const radio of document.querySelectorAll('input[data-family]'))radio.checked=themeColors[radio.dataset.family]===radio.value;
 updateLaunchReady();
}
ipcRenderer.invoke('get-config').then(cfg=>{
 themeColors=readThemeColors({...cfg.settings.theme_colors,...changedThemeColors});
 for(const row of document.querySelectorAll('.theme-row'))styleThemePreview(row,row.dataset.theme,themeColors[row.dataset.theme]);
 for(const radio of document.querySelectorAll('input[data-family]'))radio.checked=themeColors[radio.dataset.family]===radio.value;
});
function updateLaunchReady(){
 const ready=!!selectedFamily&&document.getElementById('ob-gooner-check').checked;
 document.getElementById('ob-continue').disabled=!ready;
 document.getElementById('ob-status').textContent=ready?'Ready to go.':selectedFamily?'Confirm the checkbox to continue.':'Choose a theme to get started.';
}
document.getElementById('ob-gooner-check').addEventListener('change',updateLaunchReady);
document.getElementById('btn-minimize').onclick=()=>ipcRenderer.send('win-minimize');
document.getElementById('btn-close').onclick=()=>ipcRenderer.send('win-close');
document.getElementById('ob-continue').onclick=async()=>{
 const button=document.getElementById('ob-continue');button.disabled=true;
 try{await ipcRenderer.invoke('set-config','theme_family',selectedFamily);await ipcRenderer.invoke('set-config','theme_tint',selectedTint);await ipcRenderer.invoke('set-config','theme_colors',{...themeColors});await ipcRenderer.invoke('set-config','onboarding_completed',true);ipcRenderer.send('onboarding-done');}
 catch(error){document.getElementById('ob-status').textContent='Could not save your choice. Please try again.';button.disabled=false;}
};
</script>
</body>
</html>
